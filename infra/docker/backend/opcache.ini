; O codigo e imutavel na imagem e cada deploy recria o container: nao confere a data dos arquivos.
; Mudou o .env ou rodou config:cache com o Apache no ar? Reinicie o container do backend.
opcache.enable=1
opcache.validate_timestamps=0
opcache.max_accelerated_files=20000
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
; Sem JIT: a carga e I/O de banco
opcache.jit=disable
opcache.jit_buffer_size=0
