name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes
        run: php artisan test

  docker-build:
    name: Build da imagem do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem (sem push)
        run: docker build -f infra/docker/backend/Dockerfile -t footfy/backend:ci .

  deploy:
    name: Deploy no servidor
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, footfy-server]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      FOOTFY_SERVER_DIR: ${{ vars.FOOTFY_SERVER_DIR }}
    steps:
      - name: Deploy do backend
        run: |
          DIR="$FOOTFY_SERVER_DIR"
          if [ -z "$DIR" ]; then
            if [ "$DEPLOY_ENV" = production ]; then
              DIR="$HOME/analitix/footfy"
            else
              echo "FOOTFY_SERVER_DIR não definida no environment $DEPLOY_ENV"
              exit 1
            fi
          fi
          "$DIR/deploy.sh" backend
