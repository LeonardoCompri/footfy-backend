name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes
        run: php artisan test

  deploy:
    name: Deploy no servidor
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, footfy-server]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FOOTFY_SERVER_DIR: ${{ vars.FOOTFY_SERVER_DIR }}
    steps:
      - name: Deploy do backend
        run: '"${FOOTFY_SERVER_DIR:-$HOME/analitix/footfy}/deploy.sh" backend'
